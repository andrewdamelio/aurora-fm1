# AURORA's site on GitHub Pages: the browser emulator (web/dist) at the root, the guide at /help.html.
# Needs Settings > Pages > Build and deployment > Source: GitHub Actions (once).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: The site
        run: |
          mkdir _site
          cp web/dist/index.html web/dist/worklet.js web/dist/aurora.wasm web/dist/aurora-js.js _site/
          cp docs/help.html _site/help.html
          cp -r docs/screens _site/screens

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
