# AURORA's releases: push a tag vX.Y. The FM-1 Firmware Hub's shared workflow builds aurora-X.Y.fwsc from this source
# on GitHub, signs it (a build attestation: "Built from source on GitHub" on the hub) and publishes the release.
# Do not replace or add the .fwsc by hand afterwards: the hub checks its SHA-256.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write        # the release
      id-token: write        # the signing certificate
      attestations: write    # the attestation
    with:
      build: sh tools/build_fwsc.sh "${GITHUB_REF_NAME#v}"
      packages: build/aurora-*.fwsc
