# AURORA: a test build of the FM-1 package (tools/build_fwsc.sh, on GR!MM's build system) on every push but to main,
# or by hand: the package is a workflow artifact. Releases are release.yml (the Firmware Hub's signed build, on a tag).
# The JieLi toolchain comes from pkgman.jieliapp.com (GR!MM's tools/get_toolchain.sh), the AC79 SDK from gitee.com.
name: test-build

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Python packages
        run: python3 -m pip install Pillow

      - name: GR!MM (the platform AURORA is built on)
        run: |
          mkdir -p build
          git init -q build/grimm
          git -C build/grimm remote add origin https://github.com/GRiMMBIENT/grimm
          git -C build/grimm fetch -q --depth 1 origin b519acbee7dbdb3e0fb82b15b86a913898c6f8f5
          git -C build/grimm checkout -q FETCH_HEAD

      - name: JieLi toolchain (pkgman.jieliapp.com)
        run: sh build/grimm/tools/get_toolchain.sh

      - name: JieLi AC79 SDK (three files of it are placed in the package)
        run: |
          for i in 1 2 3; do                     # (gitee.com drops a clone now and then: try again)
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
                https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git ~/fw-AC79_AIoT_SDK && break
            rm -rf ~/fw-AC79_AIoT_SDK
            sleep 20
          done
          test -d ~/fw-AC79_AIoT_SDK

      - name: Build
        run: |
          sh tools/build_fwsc.sh
          (cd build && sha256sum aurora*.fwsc > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: aurora-fwsc
          path: |
            build/aurora*.fwsc
            build/SHA256SUMS
          if-no-files-found: error
